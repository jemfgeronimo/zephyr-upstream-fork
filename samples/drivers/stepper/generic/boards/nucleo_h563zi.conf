# Default CONFIG_STEP_INTERVAL_NS (1ms/microstep, 256 microsteps/step) only
# turns the motor at ~1 RPM - too slow for StallGuard2's back-EMF-based load
# estimate to produce a meaningful signal. 50us/microstep gives ~20k
# microsteps/sec (~78 full steps/sec, ~23 RPM) for a real StallGuard test.
CONFIG_STEP_INTERVAL_NS=50000
